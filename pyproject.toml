[project]
name = "sushi-assistant"
version = "0.1.0"
description = "A production-ready RAG assistant for sushi preparation and food safety guidelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "minsearch>=0.2.0",
    "numpy>=2.4.6",
    "openai>=2.53.0",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
