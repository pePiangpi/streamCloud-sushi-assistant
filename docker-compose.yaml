version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sushi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana   # <--- 
    depends_on:
      - postgres

  streamlit:
    build: .
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sushi
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - postgres

  grafana-init:
    image: python:3.10-slim
    volumes:
      - ./grafana:/app
    working_dir: /app
    command: >
      bash -c "pip install requests python-dotenv && python init.py"
    environment:
      - GRAFANA_URL=http://grafana:3000
      - POSTGRES_HOST=postgres
    depends_on:
      - grafana
      - postgres

volumes:
  postgres_data:
  grafana_data:                          #